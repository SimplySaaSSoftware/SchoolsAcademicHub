<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — School Hub</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
  <link rel="apple-touch-icon" href="/icon-180.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#4F46E5"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<main class="login-page" role="main">
  <div class="login-card">
    <div id="lang-toggle-wrap" class="lang-toggle-wrap"></div>
    <h1 class="login-card__title" data-i18n="setNewPassword">Set New Password</h1>
    <div id="error-banner" class="error-banner" role="alert" hidden></div>
    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="new-password" data-i18n="newPassword">New Password</label>
        <input id="new-password" class="form-control" type="password" minlength="8" required autocomplete="new-password"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password" data-i18n="confirmPassword">Confirm Password</label>
        <input id="confirm-password" class="form-control" type="password" minlength="8" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn btn--primary" data-i18n="updatePassword">Update Password</button>
    </form>
  </div>
</main>
<script src="/js/config.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');
const school = params.get('school');
const errBanner = document.getElementById('error-banner');
mountLangToggle(document.getElementById('lang-toggle-wrap'));
applyI18n();

if (!token || !school) {
  errBanner.textContent = t('invalidLink');
  errBanner.hidden = false;
  document.getElementById('reset-form').hidden = true;
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errBanner.hidden = true;
  const pw  = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;
  if (pw !== pw2) { errBanner.textContent = t('noMatch'); errBanner.hidden = false; return; }
  if (pw.length < 8) { errBanner.textContent = t('pwShort'); errBanner.hidden = false; return; }

  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = t('updating');
  try {
    await confirmPasswordReset(school, token, pw);
    errBanner.className = 'error-banner error-banner--success';
    errBanner.textContent = t('pwUpdated');
    errBanner.hidden = false;
    setTimeout(() => { window.location.href = `/${school}`; }, 2000);
  } catch (err) {
    errBanner.textContent = tErr(err.message);
    errBanner.hidden = false;
    btn.disabled = false; btn.textContent = t('updatePassword');
  }
});
</script>
</body>
</html>
