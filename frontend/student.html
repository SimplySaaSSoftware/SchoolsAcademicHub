<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School Hub — Student</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <link rel="stylesheet" href="/css/quiz.css"/>
</head>
<body class="page-wrapper">
<header class="site-header site-header--student" id="site-header">
  <span class="site-header__brand" id="school-brand">School Hub</span>
  <div class="site-header__user" id="student-name" hidden></div>
  <div class="site-header__actions">
    <span id="lang-toggle-wrap"></span>
    <span class="grade-badge" id="grade-badge"></span>
    <button id="btn-logout" class="btn btn--ghost btn--sm" data-i18n="logout">Logout</button>
  </div>
</header>
<div id="notification" class="notification" hidden role="status" aria-live="polite"></div>
<main style="flex:1;padding-top:1.5rem;width:100%">
  <p class="loading-text" data-i18n="loading">Loading…</p>
</main>
<script src="/js/config.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/mobile.js"></script>
<script src="/js/safe-html.js"></script>
<script src="/js/channels.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/student.js"></script>
</body>
</html>
